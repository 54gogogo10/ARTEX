name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: artex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      # The DB-backed tests assume a pristine database per package (the suite
      # predates CI and was only ever run per-package locally): state left by an
      # earlier package trips later assertions. Recreate artex_test before each.
      - name: go test (fresh DB per package)
        run: |
          set -euo pipefail
          status=0
          for pkg in $(go list ./...); do
            psql -h localhost -U artex -d artex -c "DROP DATABASE IF EXISTS artex_test WITH (FORCE)" >/dev/null
            psql -h localhost -U artex -d artex -c "CREATE DATABASE artex_test" >/dev/null
            if ! ARTEX_PG_DSN="postgres://artex:artex@localhost:5432/artex_test?sslmode=disable" \
                 go test -count=1 "$pkg"; then
              status=1
            fi
          done
          exit $status
      - name: vulnerability scan
        # Non-blocking: a NEW upstream advisory between releases shouldn't fail
        # unrelated PRs. Check the log and bump deps in a dedicated PR.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: biome check
        # Non-blocking: the checked-in baseline is not biome-clean yet (hundreds
        # of fixable findings across the tree). Flip to blocking after a cleanup
        # PR; the static build below stays the hard gate meanwhile.
        continue-on-error: true
        run: npm run check
      - name: static export build
        run: npm run build:static
      - name: dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
